<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Miss France 2027 — Comité parallèle</title>
    <meta name="description" content="Pronostics, quiz et jeux entre amis pour l'élection de Miss France 2027.">
    <meta name="theme-color" content="#F7F2EE">
    <link rel="manifest" href="/manifest.webmanifest">
    <link rel="icon" href="/icons/icon-192.png" type="image/png">
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="apple-mobile-web-app-title" content="Miss France">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Inter:wght@400;500;600;700&display=swap">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main class="login">
        <div class="login-cover">
            <img id="cover-a" src="/img/candidates/picardie-1.jpg" alt="">
            <img id="cover-b" src="/img/candidates/martinique-1.jpg" alt="" style="opacity: 0">
            <div class="cover-top"><span>Édition spéciale</span><span id="cover-date">Déc. 2026</span></div>
            <h1 class="cover-masthead">Miss<br>France</h1>
            <p class="cover-line"><span id="cand-count">31</span> candidates, une seule couronne</p>
            <span class="cover-tag">Le jeu du comité · <span class="edition-year">2027</span></span>
        </div>

        <form class="login-body" id="login-form" novalidate>
            <p class="login-pitch" id="pitch">Faites vos <em>pronostics</em> avant le grand soir.</p>
            <p class="hint" id="login-hint">Choisis un pseudo et entre le code de soirée. Reprends le même pseudo pour retrouver tes pronostics.</p>

            <div class="login-fields">
                <label class="field">Pseudo
                    <input type="text" id="pseudo" placeholder="Votre pseudo" maxlength="24" autocomplete="username" autocapitalize="off" required>
                </label>
                <label class="field"><span id="code-label">Code de soirée</span>
                    <input type="text" id="code" placeholder="Ton code" maxlength="72" autocomplete="off" autocapitalize="characters" autocorrect="off" spellcheck="false" required>
                </label>
            </div>

            <p class="form-msg" id="form-msg" role="status" aria-live="polite"></p>

            <button type="submit" class="btn btn-block btn-between" id="submit-btn">
                <span id="submit-label">Entrer</span>
                <svg class="arrow" viewBox="0 0 22 14" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><path d="M0 7h20M14 1l6 6-6 6"/></svg>
            </button>
            <button type="button" class="btn-link login-switch" id="switch-btn">Accès organisateur</button>
        </form>
    </main>

    <script>
        let mode = 'player'; // 'player' : pseudo + code de soirée · 'admin' : pseudo + mot de passe
        const $ = (id) => document.getElementById(id);

        // Couverture : les photos des candidates défilent en fondu
        const covers = ['picardie', 'martinique', 'normandie', 'guyane', 'tahiti', 'rhone-alpes', 'bretagne', 'corse', 'aquitaine', 'reunion']
            .map(s => `/img/candidates/${s}-1.jpg`);
        let coverIndex = 1, front = 'cover-a';
        setInterval(() => {
            coverIndex = (coverIndex + 1) % covers.length;
            const back = front === 'cover-a' ? 'cover-b' : 'cover-a';
            const img = $(back);
            img.onload = () => { img.style.opacity = 1; $(front).style.opacity = 0; front = back; };
            img.src = covers[coverIndex];
        }, 4500);

        fetch('/api/edition').then(r => r.ok ? r.json() : null).then(info => {
            if (!info) return;
            document.querySelectorAll('.edition-year').forEach(el => { el.textContent = info.year; });
            $('cand-count').textContent = info.candidatesCount;
            document.title = `Miss France ${info.year} — Comité parallèle`;
        }).catch(() => {});

        // Déjà connecté : direction l'appli
        fetch('/api/me').then(r => { if (r.ok) location.replace('/app.html'); }).catch(() => {});

        function setMode(next) {
            mode = next;
            const admin = mode === 'admin';
            const input = $('code');
            input.value = '';
            input.type = admin ? 'password' : 'text';
            input.placeholder = admin ? '••••••' : "Ton code";
            input.autocomplete = admin ? 'current-password' : 'off';
            $('code-label').textContent = admin ? 'Mot de passe' : 'Code de soirée';
            $('switch-btn').textContent = admin ? "Retour à l'accès joueur" : 'Accès organisateur';
            $('login-hint').hidden = admin;
            showMsg('');
        }

        function showMsg(text, type = 'error') {
            const el = $('form-msg');
            el.textContent = text;
            el.className = `form-msg ${text ? type : ''}`;
        }

        $('switch-btn').addEventListener('click', () => setMode(mode === 'player' ? 'admin' : 'player'));

        $('login-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const pseudo = $('pseudo').value.trim();
            const code = $('code').value;
            if (!pseudo) return showMsg('Entre ton pseudo.');
            if (!code.trim()) return showMsg(mode === 'admin' ? 'Entre ton mot de passe.' : 'Entre le code de soirée.');

            $('submit-btn').disabled = true;
            try {
                const response = await fetch('/api/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ pseudo, code })
                });
                const data = await response.json().catch(() => ({}));
                if (!response.ok) {
                    showMsg(data.error || 'Une erreur est survenue.');
                    $('submit-btn').disabled = false;
                    return;
                }
                showMsg(data.created ? 'Bienvenue au comité !' : 'Bon retour !', 'success');
                location.href = '/app.html';
            } catch {
                showMsg('Impossible de joindre le serveur.');
                $('submit-btn').disabled = false;
            }
        });

        if ('serviceWorker' in navigator) navigator.serviceWorker.register('/sw.js').catch(() => {});
    </script>
</body>
</html>
